name: Build Voix Live Detection

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoixLive-source.zip'
      - '.github/workflows/build-voix-live.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: |
          rm -rf app-source
          mkdir app-source
          unzip -q VoixLive-source.zip -d app-source
      - name: Build installable APK
        run: gradle -p app-source :app:assembleDebug
      - name: Publish durable APK
        run: |
          cp app-source/app/build/outputs/apk/debug/app-debug.apk Voix-Live-Detection-v2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Voix-Live-Detection-v2.apk
          git diff --cached --quiet || git commit -m "Build Voix Live Detection v2 APK [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Voix-Live-Detection-v2
          path: Voix-Live-Detection-v2.apk
